services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: zbm-platform-backend:${ZBM_IMAGE_TAG:-dev}
    container_name: zbm-platform-backend
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      SERVER_PORT: 8080
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      JAVA_OPTS: ${JAVA_OPTS:--XX:MaxRAMPercentage=75.0 -XX:+UseZGC -XX:+HeapDumpOnOutOfMemoryError}
      ZBM_DB_URL: jdbc:mysql://${ZBM_DB_HOST:-jdpm-mysql}:${ZBM_DB_PORT:-3306}/${ZBM_DB_NAME:-zbm_dev_v1}?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=GMT%2B8&autoReconnect=true&rewriteBatchedStatements=true&allowPublicKeyRetrieval=true&nullCatalogMeansCurrent=true
      ZBM_DB_USERNAME: ${ZBM_DB_USERNAME:?set ZBM_DB_USERNAME in .env}
      ZBM_DB_PASSWORD: ${ZBM_DB_PASSWORD:?set ZBM_DB_PASSWORD in .env}
      ZBM_REDIS_HOST: ${ZBM_REDIS_HOST:-jdpm-redis}
      ZBM_REDIS_PORT: ${ZBM_REDIS_PORT:-6379}
      ZBM_REDIS_DATABASE: ${ZBM_REDIS_DATABASE:-0}
      ZBM_REDIS_PASSWORD: ${ZBM_REDIS_PASSWORD:?set ZBM_REDIS_PASSWORD in .env}
      ZBM_FLYWAY_ENABLED: ${ZBM_FLYWAY_ENABLED:?set ZBM_FLYWAY_ENABLED in .env}
      ZBM_MULTIPART_LOCATION: ${ZBM_MULTIPART_LOCATION:-/app/temp}
      ZBM_PUBLIC_URL: ${ZBM_PUBLIC_URL:-}
      ZBM_JWT_SECRET_KEY: ${ZBM_JWT_SECRET_KEY:?set ZBM_JWT_SECRET_KEY in .env}
      ZBM_JUSTAUTH_MAXKEY_SERVER_URL: ${ZBM_JUSTAUTH_MAXKEY_SERVER_URL:-}
      ZBM_JUSTAUTH_MAXKEY_CLIENT_ID: ${ZBM_JUSTAUTH_MAXKEY_CLIENT_ID:-}
      ZBM_JUSTAUTH_MAXKEY_CLIENT_SECRET: ${ZBM_JUSTAUTH_MAXKEY_CLIENT_SECRET:-}
      ZBM_JUSTAUTH_GITEE_CLIENT_ID: ${ZBM_JUSTAUTH_GITEE_CLIENT_ID:-}
      ZBM_JUSTAUTH_GITEE_CLIENT_SECRET: ${ZBM_JUSTAUTH_GITEE_CLIENT_SECRET:-}
      ZBM_CUSTOMER_SECURITY_ENABLED: ${ZBM_CUSTOMER_SECURITY_ENABLED:-false}
      ZBM_FIELD_ENCRYPT_ENABLED: ${ZBM_FIELD_ENCRYPT_ENABLED:-false}
      ZBM_CUSTOMER_FIELD_ENCRYPT_KEY: ${ZBM_CUSTOMER_FIELD_ENCRYPT_KEY:-}
      ZBM_CUSTOMER_IDENTITY_HMAC_KEY: ${ZBM_CUSTOMER_IDENTITY_HMAC_KEY:-}
      ZBM_CUSTOMER_PII_KEY_VERSION: ${ZBM_CUSTOMER_PII_KEY_VERSION:-}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    volumes:
      - ${ZBM_BACKEND_DIR:-/opt/zbm/backend}/current/ruoyi-admin.jar:/app/ruoyi-admin.jar:ro
      - backend-logs:/app/logs
      - backend-temp:/app/temp
    networks:
      - zbm-external
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 5

  frontend:
    image: nginx:1.27-alpine
    container_name: zbm-platform-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8088}:80"
    volumes:
      - ${ZBM_FRONTEND_DIR:-/opt/zbm/frontend}:/usr/share/nginx/zbm:ro
      - ./nginx/conf/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - zbm-external
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

networks:
  zbm-external:
    external: true
    name: ${DOCKER_EXTERNAL_NETWORK:-common-net}

volumes:
  backend-logs:
  backend-temp:

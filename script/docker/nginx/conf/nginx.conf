map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream zbm_backend {
    server backend:8080;
    keepalive 32;
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    # Mount the stable frontend parent so each request resolves the current symlink.
    # This allows an atomic current switch without recreating the Nginx container.
    root /usr/share/nginx/zbm/current;
    index index.html;
    client_max_body_size 20m;
    gzip_static on;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location ~ ^/prod-api/actuator(?:/|$) {
        return 403;
    }

    # Vite production API prefix. This also carries SSE and WebSocket traffic
    # such as /prod-api/resource/message.
    location /prod-api/ {
        proxy_pass http://zbm_backend/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400s;
        proxy_send_timeout 300s;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_cache off;
    }

    location /assets/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    location = /index.html {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
